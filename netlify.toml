# Frontend: client/ | API: Netlify Function (Express)
[build]
  base = "client"
  command = "npm install --prefix .. && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  included_files = ["src/**", "shared/**"]

[[redirects]]
  from = "/api/expenses"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/expenses/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
