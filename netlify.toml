# Frontend: client/ | Netlify Function yalnızca client/ altında (src/ backend'e dokunmaz)
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "client/netlify/functions"

[[redirects]]
  from = "/api/expenses"
  to = "/.netlify/functions/expenses"
  status = 200
  force = true

[[redirects]]
  from = "/api/expenses/*"
  to = "/.netlify/functions/expenses"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
